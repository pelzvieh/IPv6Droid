[versions]
billing = "7.0.0"
bouncycastle = "1.78.1"
constraintlayout = "2.1.4"
core = "1.13.1"
gradle = "8.3.2"
localbroadcastmanager = "1.1.0"
preference = "1.2.1"
retrofit = "2.11.0"
androidx-annotation = "1.8.2"
kotlib = "1.8.22"

[libraries]
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-localbroadcastmanager = { module = "androidx.localbroadcastmanager:localbroadcastmanager", version.ref = "localbroadcastmanager" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }
bcpkix-jdk15to18 = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncycastle" }
bctls-jdk15to18 = { module = "org.bouncycastle:bctls-jdk15to18", version.ref = "bouncycastle" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit"}
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit"}
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation"}
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlib" }
kotlin-stdlib-sdk7 = {group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk7", version.ref = "kotlib"}
kotlin-stdlib-sdk8 = {group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlib"}
[plugins]
